<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>今日のごはん · LNPRJ10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Space+Mono&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-head">
    <div class="app-title-group">
      <svg class="app-icon" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 15 C6 9.4 10.5 5.8 16 5.8 C21.5 5.8 26 9.4 26 15 Z" fill="#EAD9C0" />
        <path d="M3.5 15 H28.5 C28.5 21.9 22.9 27.5 16 27.5 C9.1 27.5 3.5 21.9 3.5 15 Z" fill="#A8432B" />
        <rect x="11.5" y="27" width="9" height="2.6" rx="1.3" fill="#8A3521" />
      </svg>
      <span class="app-title">今日のごはん</span>
    </div>
    <div class="app-sub">附近吃什麼</div>
  </header>

  <section class="controls" id="controls" hidden>
    <div class="loc-mode-seg" id="locModeSeg">
      <button data-mode="here" class="active" type="button">📍 現在地</button>
      <button data-mode="search" type="button">🔍 輸入地點</button>
    </div>

    <div class="loc-input-wrap" id="locInputWrap" hidden>
      <span class="loc-input-icon" id="locInputIcon">🔍</span>
      <input class="loc-input" id="locInput" type="text"
        placeholder="台北101、中山站、住址…" inputmode="search" />
    </div>

    <div class="loc-status" id="locStatus">
      <span class="loc-status-text" id="locStatusText">📍 以你的目前位置為基準</span>
      <button class="loc-status-action" id="locRelocateBtn" type="button">重新定位</button>
    </div>

    <div class="chip-row" id="chipRow">
      <button class="chip active" data-type="all">全部</button>
      <button class="chip" data-type="japanese">日式</button>
      <button class="chip" data-type="korean">韓式</button>
      <button class="chip" data-type="chinese">中式</button>
      <button class="chip" data-type="vegetarian">素食</button>
      <button class="chip" data-type="cafe">咖啡</button>
      <button class="chip" data-type="western">西式</button>
      <button class="chip" data-type="thai">泰式</button>
      <button class="chip" data-type="vietnamese">越南</button>
      <button class="chip" data-type="indian">印度</button>
      <button class="chip" data-type="bbq">燒肉烤肉</button>
      <button class="chip" data-type="seafood">海鮮</button>
      <button class="chip" data-type="brunch">早午餐</button>
      <button class="chip" data-type="dessert">甜點</button>
      <button class="chip" data-type="bar">酒吧</button>
      <button class="chip" data-type="fastfood">速食</button>
    </div>

    <div class="filter-row">
      <div class="seg" id="radiusSeg">
        <button data-radius="500">500m</button>
        <button data-radius="1000" class="active">1km</button>
        <button data-radius="3000">3km</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="openNowToggle" checked />
        <span class="track"></span>
        <span>僅營業中</span>
      </label>
      <button class="btn btn-ghost" id="reshuffleBtn" style="margin-left:auto">換一批</button>
    </div>
  </section>

  <div class="status hidden" id="statusBox"></div>

  <main class="list" id="list"></main>

  <p class="disclaimer">資料來自 Google · 評分僅供參考</p>

  <div class="toast" id="toast"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/app.js"></script>
  <script src="https://lnprj.neillin-lct.workers.dev/lnprj-nav.js"></script>
  <script>
    if (window.LNPRJ) LNPRJ.init({ current: 10, basePath: '../../' });
  </script>
</body>
</html>
